# 1. Cấu hình Cổng ứng dụng (Server Port)
server.port=8080

# 2. Cấu hình Kết nối PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/aicheck_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. Cấu hình Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 4. Cấu hình định dạng Jackson (Trả về JSON format đúng chuẩn DateTime)
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh