openapi: 3.0.3
info:
  title: AICheck System API
  description: Hệ thống kiểm tra và phát hiện đạo văn, AI trong bài nộp
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local Development Server

paths:
  # =========================================================================
  # 1. XÁC THỰC DÀNH CHO SINH VIÊN (STUDENT AUTHENTICATION)
  # =========================================================================
  /api/v1/auth/student/login:
    post:
      tags:
        - Student - Authentication
      summary: Đăng nhập dành cho Sinh viên (Dùng Mã sinh viên)
      description: Sinh viên nhập mã sinh viên và mật khẩu. Backend sẽ kiểm tra và lấy Token từ Keycloak.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentLoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công, trả về Access Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Sai mã sinh viên hoặc mật khẩu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLoginResponse'

  # =========================================================================
  # 2. XÁC THỰC DÀNH CHO GIÁO VIÊN (TEACHER AUTHENTICATION)
  # =========================================================================
  /api/v1/auth/teacher/login:
    post:
      tags:
        - Teacher - Authentication
      summary: Đăng nhập dành cho Giáo viên (Dùng Mã giáo viên)
      description: Giáo viên nhập mã giáo viên và mật khẩu. Backend sẽ kiểm tra và lấy Token từ Keycloak.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherLoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công, trả về Access Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Dữ liệu gửi lên không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLoginResponse'
        '401':
          description: Sai mã giáo viên hoặc mật khẩu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLoginResponse'

  # =========================================================================
  # 3. QUÊN MẬT KHẨU & KHÔI PHỤC TÀI KHOẢN (PASSWORD RECOVERY)
  # =========================================================================
  /api/v1/auth/forgot-password:
    post:
      tags:
        - Authentication - Forgot Password
      summary: Quên mật khẩu (Gửi email qua Keycloak)
      description: Sinh viên/Giáo viên nhập email trường cấp. Keycloak sẽ gửi liên kết đặt lại mật khẩu về hòm thư.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Yêu cầu thành công, kiểm tra email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Không tìm thấy tài khoản gắn với email này

  # =========================================================================
  # 4. KỲ THI DÀNH CHO SINH VIÊN (STUDENT EXAMINATIONS)
  # =========================================================================
  /api/v1/student/exams:
    get:
      tags:
        - Student - Exam
      summary: Lấy danh sách kỳ thi của sinh viên
      description: Trả về toàn bộ danh sách các ca thi đang mở (Actived) hoặc sắp mở (Prepare) để sinh viên tham gia.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lấy danh sách kỳ thi thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExamItemResponse'
        '401':
          description: Chưa đăng nhập hoặc Token hết hạn
        '403':
          description: Không có quyền truy cập (Chỉ dành cho Sinh viên)

  /api/v1/student/exams/{examId}/join:
    post:
      tags:
        - Student - Exam
      summary: Sinh viên nhập mã phòng (Passcode) để vào ca thi
      description: Sinh viên nhập mã passcode 6 ký tự do giám thị cung cấp. Nếu hợp lệ, hệ thống ghi nhận thời điểm tham gia (joinAt) và trả về thông tin cho phép bắt đầu tính giờ làm bài.
      security:
        - BearerAuth: []
      parameters:
        - name: examId
          in: path
          required: true
          description: ID của kỳ thi (UUID)
          schema:
            type: string
            format: uuid
            example: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPasscodeRequest'
      responses:
        '200':
          description: Mã phòng hợp lệ, sinh viên bắt đầu làm bài
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyPasscodeResponse'
        '400':
          description: Sai mã phòng thi (passcode) hoặc ca thi chưa mở / đã đóng
        '401':
          description: Chưa đăng nhập hoặc Token hết hạn
        '403':
          description: Không có quyền tham gia kỳ thi này
        '404':
          description: Không tìm thấy kỳ thi

  /api/v1/student/exams/{examId}/questions:
    get:
      tags:
        - Student - Exam
      summary: Lấy danh sách câu hỏi của kỳ thi
      description: Lấy danh sách các câu hỏi / đề bài tự luận của kỳ thi để sinh viên làm bài.
      security:
        - BearerAuth: []
      parameters:
        - name: examId
          in: path
          required: true
          description: ID của kỳ thi (UUID)
          schema:
            type: string
            format: uuid
            example: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
      responses:
        '200':
          description: Lấy danh sách câu hỏi thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/listQuestion'
        '401':
          description: Chưa đăng nhập hoặc Token hết hạn
        '403':
          description: Không có quyền truy cập hoặc kỳ thi chưa tới giờ mở
        '404':
          description: Không tìm thấy kỳ thi

  /api/v1/student/exams/{examId}/submit:
    post:
      tags:
        - Student - Exam
      summary: Sinh viên nộp bài thi theo ID kỳ thi
      description: Sinh viên nộp bài làm tự luận cho kỳ thi. Hệ thống tự động ghi nhận thời gian nộp, đếm số từ và kích hoạt hàng đợi quét AI. ID sinh viên được lấy từ Token.
      security:
        - BearerAuth: []
      parameters:
        - name: examId
          in: path
          required: true
          description: ID của kỳ thi (UUID)
          schema:
            type: string
            format: uuid
            example: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitExamRequest'
      responses:
        '200':
          description: Nộp bài thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitExamResponse'
        '400':
          description: Đã hết thời gian nộp bài hoặc bài làm rỗng
        '401':
          description: Chưa đăng nhập hoặc Token hết hạn
        '403':
          description: Không có quyền nộp bài cho ca thi này
        '404':
          description: Không tìm thấy kỳ thi

  /api/v1/student/{studentId}/major:
    get:
      tags:
        - Student - Major
      summary: Lấy thông tin chuyên ngành của sinh viên
      description: Trả về thông tin chuyên ngành mà sinh viên đang theo học (bao gồm ID chuyên ngành, mã chuyên ngành).
      security:
        - BearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          description: ID của sinh viên (UUID)
          schema:
            type: string
            format: uuid
            example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      responses:
        '200':
          description: Lấy thông tin chuyên ngành thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentMajorResponse'
        '401':
          description: Chưa đăng nhập hoặc Token hết hạn
        '403':
          description: Không có quyền truy cập
        '404':
          description: Không tìm thấy sinh viên

  /api/v1/student/majors/{majorId}/subjects:
    get:
      tags:
        - Student - Major
      summary: Lấy danh sách môn học theo chuyên ngành
      description: Trả về danh sách tất cả các môn học thuộc chuyên ngành cụ thể theo ID chuyên ngành (UUID).
      security:
        - BearerAuth: []
      parameters:
        - name: majorId
          in: path
          required: true
          description: ID của chuyên ngành (UUID)
          schema:
            type: string
            format: uuid
            example: "8da95f64-5717-4562-b3fc-2c963f66afb7"
      responses:
        '200':
          description: Lấy danh sách môn học thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubjectMajorResponse'
        '401':
          description: Chưa đăng nhập hoặc Token hết hạn
        '403':
          description: Không có quyền truy cập
        '404':
          description: Không tìm thấy chuyên ngành

  # =========================================================================
  # 5. LỊCH SỬ THI DÀNH CHO SINH VIÊN (STUDENT EXAM HISTORY)
  # =========================================================================
  /api/v1/student/history:
    get:
      tags:
        - Student - Exam History
      summary: Danh sách lịch sử các bài thi đã làm của sinh viên
      description: Lấy danh sách các bài thi mà sinh viên đang đăng nhập đã từng tham gia và nộp bài. ID sinh viên được trích xuất tự động từ Access Token (JWT), đảm bảo an toàn và bảo mật.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lấy danh sách lịch sử thi thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentExamHistorySummaryResponse'
        '401':
          description: Chưa đăng nhập hoặc Token hết hạn
        '403':
          description: Không có quyền truy cập (Chỉ dành cho sinh viên)

  /api/v1/student/history/{historyId}:
    get:
      tags:
        - Student - Exam History
      summary: Xem chi tiết 1 bài kiểm tra đã làm theo ID lịch sử
      description: Xem tổng quan kết quả ca thi, điểm số, đánh giá nhận xét của giảng viên. Hệ thống tự động đối soát quyền sở hữu bài thi thông qua Token của người đăng nhập.
      security:
        - BearerAuth: []
      parameters:
        - name: historyId
          in: path
          required: true
          description: ID bản ghi lịch sử nộp bài (UUID)
          schema:
            type: string
            format: uuid
            example: "9a2f76c5-4d22-4217-a068-07d0f171e54a"
      responses:
        '200':
          description: Lấy chi tiết lịch sử bài thi thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentExamHistoryDetailResponse'
        '401':
          description: Chưa đăng nhập hoặc Token hết hạn
        '403':
          description: Không có quyền truy cập (Không phải chủ sở hữu bài thi này)
        '404':
          description: Không tìm thấy bài thi hoặc lịch sử không tồn tại

  /api/v1/student/history/{historyId}/submission-details:
    get:
      tags:
        - Student - Exam History
      summary: Xem chi tiết đề bài, câu trả lời đã nộp và phân tích AI Stylometry
      description: Đi sâu vào xem câu hỏi trong đề, nội dung câu trả lời tự luận mà sinh viên đã nộp cùng kết quả phân tích AI Stylometry (đạo văn, từ vựng, ngữ pháp).
      security:
        - BearerAuth: []
      parameters:
        - name: historyId
          in: path
          required: true
          description: ID bản ghi lịch sử nộp bài (UUID)
          schema:
            type: string
            format: uuid
            example: "9a2f76c5-4d22-4217-a068-07d0f171e54a"
      responses:
        '200':
          description: Lấy chi tiết câu hỏi và câu trả lời thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentSubmissionDeepDetailResponse'
        '401':
          description: Chưa đăng nhập hoặc Token hết hạn
        '403':
          description: Không có quyền truy cập (Không phải chủ sở hữu bài thi này)
        '404':
          description: Không tìm thấy bài làm

  # =========================================================================
  # 6. QUẢN LÝ KỲ THI DÀNH CHO GIÁO VIÊN (TEACHER EXAM MANAGEMENT)
  # =========================================================================
  /api/v1/teacher/exams:
    get:
      tags:
        - Teacher - Exam
      summary: Giáo viên xem lịch sử các bài kiểm tra đã tạo
      description: Lấy danh sách toàn bộ các bài kiểm tra do giáo viên đang đăng nhập khởi tạo. ID giáo viên được trích xuất tự động từ Access Token.
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Lọc theo trạng thái kỳ thi (OPEN, UPCOMING, CLOSED)
          schema:
            type: string
            example: "OPEN"
      responses:
        '200':
          description: Lấy danh sách bài kiểm tra đã tạo thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeacherExamItemResponse'
        '401':
          description: Chưa đăng nhập hoặc Token hết hạn
        '403':
          description: Không có quyền truy cập (Chỉ dành cho Giảng viên)

    post:
      tags:
        - Teacher - Exam
      summary: Tạo mới bài kiểm tra
      description: Giảng viên khởi tạo bài kiểm tra tự luận mới (chọn câu hỏi từ ngân hàng đề hoặc tự soạn thảo đề thi mới).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExamRequest'
      responses:
        '201':
          description: Khởi tạo bài kiểm tra thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateExamResponse'
        '400':
          description: Dữ liệu nhập vào không hợp lệ hoặc thiếu thông tin
        '401':
          description: Chưa đăng nhập hoặc Token hết hạn
        '403':
          description: Không có quyền tạo kỳ thi

  /api/v1/teacher/exams/{examId}:
    get:
      tags:
        - Teacher - Exam
      summary: Nhận bài kiểm tra theo ID kỳ thi
      description: Lấy đầy đủ thông tin chi tiết của bài kiểm tra theo ID kỳ thi bao gồm nội dung đề bài, môn học, khung giờ, mã passcode và thống kê số lượng bài nộp.
      security:
        - BearerAuth: []
      parameters:
        - name: examId
          in: path
          required: true
          description: ID của kỳ thi cần xem (UUID)
          schema:
            type: string
            format: uuid
            example: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
      responses:
        '200':
          description: Lấy chi tiết bài kiểm tra thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherExamDetailResponse'
        '401':
          description: Chưa đăng nhập hoặc Token hết hạn
        '403':
          description: Không có quyền xem bài kiểm tra này
        '404':
          description: Không tìm thấy kỳ thi

  /api/v1/teacher/submissions/{historyId}:
    get:
      tags:
        - Teacher - Exam
      summary: Giáo viên xem chi tiết 1 bài kiểm tra sinh viên nộp và kèm bản báo cáo AI
      description: Xem thông tin sinh viên, nội dung đề bài, toàn văn bài làm tự luận của sinh viên cùng toàn bộ báo cáo phân tích AI Stylometry (độ bất ngờ perplexity, biến thiên burstiness, từ vựng, ngữ pháp, lỗi câu).
      security:
        - BearerAuth: []
      parameters:
        - name: historyId
          in: path
          required: true
          description: ID bản ghi lịch sử nộp bài (UUID)
          schema:
            type: string
            format: uuid
            example: "9a2f76c5-4d22-4217-a068-07d0f171e54a"
      responses:
        '200':
          description: Lấy chi tiết bài nộp và báo cáo AI thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherSubmissionDetailResponse'
        '401':
          description: Chưa đăng nhập hoặc Token hết hạn
        '403':
          description: Không có quyền truy cập bài nộp này
        '404':
          description: Không tìm thấy bài làm

  /api/v1/teacher/submissions/{historyId}/grade:
    post:
      tags:
        - Teacher - Exam
      summary: Giáo viên chấm bài kiểm tra của 1 sinh viên
      description: Giảng viên nhập điểm số (thang điểm 10) và nhận xét bài thi cho sinh viên. Hệ thống tự động ghi nhận thời điểm chấm và mã giảng viên chấm lấy từ Token.
      security:
        - BearerAuth: []
      parameters:
        - name: historyId
          in: path
          required: true
          description: ID bản ghi lịch sử nộp bài (UUID)
          schema:
            type: string
            format: uuid
            example: "9a2f76c5-4d22-4217-a068-07d0f171e54a"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeSubmissionRequest'
      responses:
        '200':
          description: Chấm điểm bài thi thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeSubmissionResponse'
        '400':
          description: Điểm số không hợp lệ (phải từ 0 đến 10) hoặc thiếu nhận xét
        '401':
          description: Chưa đăng nhập hoặc Token hết hạn
        '403':
          description: Không có quyền chấm bài thi này
        '404':
          description: Không tìm thấy bài thi cần chấm

components:
  # ==========================================
  # CẤU HÌNH NÚT BẤM "AUTHORIZE" NHẬP TOKEN
  # ==========================================
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Dán Access Token nhận được từ Keycloak vào đây (Không cần gõ chữ 'Bearer')

  # ==========================================
  # ĐỊNH NGHĨA CÁC ĐỐI TƯỢNG DỮ LIỆU (DTO)
  # ==========================================
  schemas:
    # 1. Đăng nhập Sinh viên (Dùng Mã sinh viên)
    StudentLoginRequest:
      type: object
      required:
        - studentCode
        - password
      properties:
        studentCode:
          type: string
          example: "SV2026001"
          description: Mã số sinh viên
        password:
          type: string
          example: "123456"
          description: Mật khẩu

    # 2. Đăng nhập Giáo viên (Dùng Mã giáo viên)
    TeacherLoginRequest:
      type: object
      required:
        - teacherCode
        - password
      properties:
        teacherCode:
          type: string
          example: "GV2026001"
          description: Mã số giáo viên / cán bộ
        password:
          type: string
          example: "123456"
          description: Mật khẩu

    # 3. Quên mật khẩu (Dùng Email)
    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "nguyenvanan@university.edu.vn"
          description: Địa chỉ email đã đăng ký với trường

    # 4. Trả về Token khi đăng nhập thành công
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: "eyJhbGciOiJSUzI1NiIsInR5cCI6..."
          description: Chuỗi JWT Access Token từ Keycloak
        tokenType:
          type: string
          example: "Bearer"
        expiresIn:
          type: integer
          example: 300
          description: Thời gian sống của Token tính theo giây
        role:
          type: string
          example: "STUDENT"
          description: Quyền hạn của tài khoản (STUDENT hoặc TEACHER)

          # Thêm vào khoảng dòng 592 (ngang cấp với LoginResponse):
    ErrorLoginResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
