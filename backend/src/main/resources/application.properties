# 1. Cấu hình Cổng ứng dụng (Server Port)
server.port=8080

# 2. Cấu hình Kết nối PostgreSQL Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/AICheck}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345678}
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. Cấu hình Hibernate / JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
# Giữ nguyên tên thuộc tính / tên cột, không tự ý chuyển thành snake_case có dấu gạch dưới
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# 4. Cấu hình định dạng Jackson (Trả về JSON format đúng chuẩn DateTime)
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Kết nối tới máy chủ Keycloak (Realm aicheck trên cổng 8180)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/aicheck
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/aicheck/protocol/openid-connect/certs

# Thông tin cấu hình gọi Keycloak 
keycloak.auth-server-url=${KEYCLOAK_URL:http://localhost:8180}
keycloak.realm=${KEYCLOAK_REALM:aicheck}
keycloak.admin.realm=${KEYCLOAK_REALM:master}
keycloak.admin.client-id=${KEYCLOAK_CLIENT_ID:admin-cli}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:aicheck-app}
keycloak.client-secret-teacher=${KEYCLOAK_TEACHER_SECRET}
keycloak.client-secret-student=${KEYCLOAK_STUDENT_SECRET}
keycloak.admin.username=${KEYCLOAK_ADMIN_USER:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASS:admin}
